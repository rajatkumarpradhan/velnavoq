<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClientDesk QA</title><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#0b1220;color:#ecf3ff;font:15px system-ui}h1{font-size:30px;letter-spacing:-1px}p{color:#aabbcf;line-height:1.6}button,input{min-height:44px;font:inherit;background:#172940;color:#ecf3ff;border:1px solid #526b89;border-radius:8px;padding:10px;width:100%;margin:8px 0}button{cursor:pointer}article{padding:16px;border:1px solid #334b67;border-radius:10px;margin-top:14px}label{display:block;margin-top:14px}small{color:#aabbcf}#rows{margin-top:24px}</style></head><body><small>PRIVATE CLIENT TRACKER / QA</small><h1>ClientDesk</h1><p>Real saved client records for your app account. This acceptance app starts empty. Do not enter real client information.</p><button id="signin">Sign in to your app account</button><div id="add"><label>Client name<input id="name" required maxlength="100"></label><label>Invoice amount<input id="amount" type="number" required min="0" step="0.01"></label><button id="save">Add client</button></div><p id="state" role="status">Loading your records</p><div id="rows"></div><script>const state=document.querySelector('#state'),rows=document.querySelector('#rows');async function load(){try{const me=await velnavoq.auth.me();document.querySelector('#signin').hidden=!!me;if(!me){rows.replaceChildren();state.textContent='Sign in to see your own records';return}const data=await velnavoq.data.list('clients');rows.replaceChildren();for(const row of data.rows){const card=document.createElement('article'),title=document.createElement('strong'),amount=document.createElement('p'),del=document.createElement('button');title.textContent=row.name;amount.textContent='Invoice: '+row.amount;del.textContent='Delete '+row.name;del.onclick=async()=>{await velnavoq.data.remove('clients',row.id);await load()};card.append(title,amount,del);rows.append(card)}state.textContent=data.rows.length?'Your saved clients':'No clients yet'}catch(e){state.textContent=e.message}}document.querySelector('#signin').onclick=()=>velnavoq.auth.signIn();document.querySelector('#save').onclick=async()=>{try{await velnavoq.data.create('clients',{name:document.querySelector('#name').value,amount:Number(document.querySelector('#amount').value),paid:false});document.querySelector('#name').value='';document.querySelector('#amount').value='';await load()}catch(e){state.textContent=e.message}};addEventListener('message',e=>{if(e.source===parent&&e.data?.kind==='vln-auth-changed')load()});load();</script></body></html>
