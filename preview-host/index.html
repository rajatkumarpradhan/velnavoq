(()=>{'use strict';const nonce=location.hash.slice(1);history.replaceState(null,'',location.pathname);window.opener?.postMessage({kind:'velnavoq-preview-host-ready',nonce},'*');let hadError=false,port=null,frame=null,html='',expiry=0,deadline=null,watch=null,functional=false,user=null,seq=0,busy=false,bridgeActive=0;const pending=new Map(),times=[];const status=document.getElementById('status'),logs=document.getElementById('logs'),mount=document.getElementById('mount'),auth=document.getElementById('auth'),account=document.getElementById('account'),accountStatus=document.getElementById('account-status');

document.getElementById('form').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;const buttons=auth.querySelectorAll('button');buttons.forEach(b=>b.disabled=true);try{const email=document.getElementById('email').value.trim().toLowerCase(),password=document.getElementById('password').value,register=e.submitter?.id==='register';if(password.length<12||password.length>128)throw Error('Use 12 to 128 characters');const salt=register?hex(crypto.getRandomValues(new Uint8Array(32))):(await call('auth/kdf','POST',{email})).salt;const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']);const verifier=hex(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',iterations:600000,salt:new TextEncoder().encode(salt)},key,256));await call(register?'auth/register':'auth/login','POST',{email,verifier,...(register?{salt}:{})});user=await call('auth/me');paint();auth.close();frame?.contentWindow.postMessage({kind:'vln-auth-changed'},'*')}catch(e){document.getElementById('error').textContent=e.message}finally{document.getElementById('password').value='';busy=false;buttons.forEach(b=>b.disabled=false)}};
window.addEventListener('message',async event=>{const d=event.data;if(event.source===window.opener&&d?.kind==='velnavoq-preview-ping'&&d.nonce===nonce){event.source.postMessage({kind:'velnavoq-preview-host-ready',nonce},event.origin);return}
